<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TrafficSense - Predict the jam before you're in it. Traffic analytics and predictions." />
    <meta name="theme-color" content="#0d9488" />
    <title>TrafficSense - Predict the jam before you're in it</title>
    <script>
      // Apply the saved / system theme before first paint to avoid a light-mode flash.
      try {
        var saved = localStorage.getItem('ts-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
